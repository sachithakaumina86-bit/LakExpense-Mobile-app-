name: LakExpense Android CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build Debug APK & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36.1 platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36.1" "platforms;android-36" "platform-tools"

      - name: Decode AI Studio debug keystore
        run: base64 --decode debug.keystore.base64 > debug.keystore

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Run unit & Robolectric tests and verify debug/release builds
        run: |
          gradle --no-daemon \
            :app:testDebugUnitTest \
            :baselineprofile:compileNonMinifiedReleaseKotlin \
            :baselineprofile:compileBenchmarkReleaseKotlin \
            :app:compileReleaseKotlin \
            :app:compileReleaseArtProfile \
            :app:assembleDebug

      - name: Upload signed Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lakexpense-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Unit & Robolectric test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lakexpense-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
