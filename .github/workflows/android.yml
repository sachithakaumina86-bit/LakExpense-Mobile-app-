name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build_and_test:
    name: Build Debug APK & Run Unit/Robolectric Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36.1 and 36 platforms
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36.1" "platforms;android-36" "platform-tools"

      - name: Restore or generate debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Run unit tests and Robolectric tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lakexpense-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unit and Robolectric test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lakexpense-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
